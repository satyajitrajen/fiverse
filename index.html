      (function() {

          },
          {
            name: 'requestArchitectureConsultation',
            description: 'Submit an architectural inquiry or schedule an AI engineering sprint consultation with Fiverse Systems.',
            inputSchema: {
              type: 'object',
              properties: {
                name: { type: 'string' },
                email: { type: 'string' },
                projectDescription: { type: 'string' }
              },
              required: ['name', 'email', 'projectDescription']
            },
            execute: async function() { return { status: 'success', message: 'Consultation requested' }; }
          }
        ];
        if (!navigator.modelContext) {
          navigator.modelContext = {
            provideContext: function(ctx) {
              if (ctx && ctx.tools) this.tools = ctx.tools;
              return Promise.resolve();
            },
            tools: tools
          };
        }
        try {
          if (typeof navigator.modelContext.provideContext === 'function') {
            navigator.modelContext.provideContext({ tools: tools });
          }
        } catch(e) {}
        window.__WEBMCP_TOOLS__ = tools;
      })();
